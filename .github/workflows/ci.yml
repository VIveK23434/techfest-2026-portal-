name: TechFest 2026 MERN CI/CD Pipeline

on:
  push:
    branches: [ main, feature-* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Security & API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Run Backend Security Tests & Jest Suite
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_32_characters_long_12345
          PORT: 5000

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build React Application (Vite)
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: https://Techfest-portal-api.onrender.com
